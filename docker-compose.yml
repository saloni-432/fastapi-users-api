services:

  db:
    image: postgres:15
    container_name: fastapi_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usersdb

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: fastapi_redis

    ports:
      - "6379:6379"

  api:
    build: .
    container_name: fastapi_app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/usersdb
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"